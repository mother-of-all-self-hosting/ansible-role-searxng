---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: searxng-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        searxng_debug_service_enabled: false

        # Variables for SearXNG
        searxng_uid: 1000
        searxng_gid: 1000
        searxng_scheme: http
        searxng_hostname: localhost
        searxng_container_labels_traefik_enabled: false
        searxng_container_http_host_bind_port: 8080
        searxng_config_server_secret_key: secret

        # Deliberately not the stock "SearXNG". The verification asks the
        # running instance for its name, and a value that the unconfigured
        # image reports just as readily would prove nothing about the role.
        searxng_config_searxng_instance_name: MASH Molecule SearXNG

        # The two different ways this role takes extra SearXNG settings. Each
        # has a surface in /config which the unconfigured image reports
        # differently, so the verification can tell that both arrived.
        #
        # They also overlap on purpose: `search:` is introduced here and added
        # to by the extension below. The role merges the two recursively, so
        # both keys must survive - a non-recursive merge would drop one.
        searxng_config_additional_configurations: |
          search:
            safe_search: 2

        searxng_configuration_extension_yaml: |
          search:
            autocomplete: google
          engines:
            - name: wikipedia
              disabled: true

        # Variables required for SearXNG to connect to the Valkey data-store (via Unix socket)
        searxng_redis_socket_enabled: true
        searxng_redis_socket_path_host: "{{ valkey_run_path }}"
        searxng_systemd_required_services_list_custom:
          - "{{ valkey_identifier }}.service"

        # Variables for Valkey
        valkey_uid: 1000
        valkey_gid: 1000
        valkey_arch: amd64
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible
